<text x="325" y="303" fill="#273c23" font-family="Arial, sans-serif" font-size="25" font-weight="600" text-anchor="start">Challenge 03: Sum an array</text>
<text x="325" y="337" fill="#748365" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">Use a loop to add each value to the total.</text>
<rect x="323" y="364" width="795" height="286" rx="10" fill="#213426"/>
<text x="344" y="405" fill="#778f7c" font-family="monospace" font-size="16" font-weight="400" text-anchor="start">1</text>
<text x="382" y="405" fill="#cce8ac" font-family="monospace" font-size="21" font-weight="400" text-anchor="start">int[] values = {2, 4, 6, 8};</text>
<text x="344" y="437" fill="#778f7c" font-family="monospace" font-size="16" font-weight="400" text-anchor="start">2</text>
<text x="382" y="437" fill="#cce8ac" font-family="monospace" font-size="21" font-weight="400" text-anchor="start">int total = 0;</text>
<text x="344" y="469" fill="#778f7c" font-family="monospace" font-size="16" font-weight="400" text-anchor="start">3</text>
<text x="382" y="469" fill="#f0f5e9" font-family="monospace" font-size="21" font-weight="400" text-anchor="start"></text>
<text x="344" y="501" fill="#778f7c" font-family="monospace" font-size="16" font-weight="400" text-anchor="start">4</text>
<text x="382" y="501" fill="#cce8ac" font-family="monospace" font-size="21" font-weight="400" text-anchor="start">for (int value : values) {</text>
<text x="344" y="533" fill="#778f7c" font-family="monospace" font-size="16" font-weight="400" text-anchor="start">5</text>
<text x="382" y="533" fill="#f0f5e9" font-family="monospace" font-size="21" font-weight="400" text-anchor="start">    total += value;</text>
<text x="344" y="565" fill="#778f7c" font-family="monospace" font-size="16" font-weight="400" text-anchor="start">6</text>
<text x="382" y="565" fill="#f0f5e9" font-family="monospace" font-size="21" font-weight="400" text-anchor="start">}</text>
<text x="344" y="597" fill="#778f7c" font-family="monospace" font-size="16" font-weight="400" text-anchor="start">7</text>
<text x="382" y="597" fill="#f0f5e9" font-family="monospace" font-size="21" font-weight="400" text-anchor="start">System.out.println(total);</text>
