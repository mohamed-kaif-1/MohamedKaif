<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img"><title>AuthForge — interface concept</title><desc>Turn a request into a governed action.. Illustrative interface with sample data.</desc>
<rect x="0" y="0" width="1200" height="900" rx="0" fill="#e8e3f3"/>
<text x="48" y="82" fill="#2d2440" font-family="Arial, sans-serif" font-size="58" font-weight="700" text-anchor="start">AuthForge</text>
<text x="50" y="126" fill="#82758f" font-family="Arial, sans-serif" font-size="22" font-weight="400" text-anchor="start">Turn a request into a governed action.</text>
<text x="50" y="866" fill="#82758f" font-family="Arial, sans-serif" font-size="14" font-weight="600" text-anchor="start">INTERFACE CONCEPT  /  SAMPLE DATA</text>
<text x="1148" y="866" fill="#82758f" font-family="Arial, sans-serif" font-size="16" font-weight="500" text-anchor="end">2026</text>
<rect x="48" y="180" width="1104" height="632" rx="16" fill="#fffefe" stroke="#e2dbea"/>
<text x="78" y="221" fill="#2d2440" font-family="Arial, sans-serif" font-size="23" font-weight="700" text-anchor="start">AF / Request workbench</text>
<text x="1118" y="220" fill="#82758f" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="end">Requests     Policies     Audit trail</text>
